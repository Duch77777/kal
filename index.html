<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalendarz 2027 – wzór 17/8</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#8a92a3;--work:#cfe3ff;--workt:#0b3a7a;--off:#ffd9a8;--offt:#7a3d00;--sun:#d33;--bd:#e3e6ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--tx:#e8ebf2;--mut:#7f889b;--work:#1f4a85;--workt:#dbe9ff;--off:#8a4a10;--offt:#ffe6c7;--sun:#ff7b7b;--bd:#2a3145}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--tx:#e8ebf2;--mut:#7f889b;--work:#1f4a85;--workt:#dbe9ff;--off:#8a4a10;--offt:#ffe6c7;--sun:#ff7b7b;--bd:#2a3145}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 12px}
h1{font-size:18px;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button,input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:active{opacity:.6}
.lg{display:flex;gap:12px;font-size:13px;flex-wrap:wrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
#info{font-size:13px;color:var(--mut)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:12px;max-width:1300px;margin:0 auto}
.m{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.m h2{font-size:15px;margin:0 0 6px;text-transform:capitalize}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.h{font-size:11px;color:var(--mut);padding-bottom:2px}
.d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:13px;cursor:pointer;user-select:none}
.d.w{background:var(--work);color:var(--workt)}
.d.o{background:var(--off);color:var(--offt)}
.d.su:not(.w):not(.o){color:var(--sun)}
.d.st{outline:2px solid var(--tx);outline-offset:-2px;font-weight:700}
</style>
</head>
<body>
<header>
<h1>Kalendarz 2027 · wzór 17 dni pracy / 8 wolnych</h1>
<div class="row">
<button data-s="-7">−7 dni</button><button data-s="-1">−1</button>
<input type="date" id="dt" min="2027-01-01" max="2027-12-31">
<button data-s="1">+1</button><button data-s="7">+7 dni</button>
</div>
<div class="row"><label>Klik w dzień ustawia: <select id="mode"><option value="w">początek pracy (17 dni)</option><option value="o">początek wolnych (8 dni)</option></select></label></div>
<div class="lg"><span><i class="sw" style="background:var(--work)"></i>Praca (17)</span><span><i class="sw" style="background:var(--off)"></i>Wolne (8)</span><span id="info"></span></div>
</header>
<main id="cal"></main>
<script>
const Y=2027,W=17,O=8,C=W+O,DAY=86400000;
const MN=["styczeń","luty","marzec","kwiecień","maj","czerwiec","lipiec","sierpień","wrzesień","październik","listopad","grudzień"];
const num=(y,m,d)=>Math.round(Date.UTC(y,m,d)/DAY);
let start=num(Y,0,1); // dzień, w którym zaczyna się blok 17 dni pracy
const fmt=n=>new Date(n*DAY).toISOString().slice(0,10);
const Y0=num(Y,0,1),Y1=num(Y,11,31);
function render(){
  const cal=document.getElementById("cal");let h="",wc=0,oc=0;
  for(let m=0;m<12;m++){
    const first=new Date(Date.UTC(Y,m,1)),dim=new Date(Date.UTC(Y,m+1,0)).getUTCDate();
    const lead=(first.getUTCDay()+6)%7;
    h+=`<section class="m"><h2>${MN[m]} ${Y}</h2><div class="g">`+["Pn","Wt","Śr","Cz","Pt","So","Nd"].map(x=>`<div class="h">${x}</div>`).join("")+"<div></div>".repeat(lead);
    for(let d=1;d<=dim;d++){
      const n=num(Y,m,d),k=(((n-start)%C)+C)%C,isW=k<W;
      isW?wc++:oc++;
      const dow=(lead+d-1)%7;
      h+=`<div class="d ${isW?"w":"o"}${dow==6?" su":""}${n==start?" st":""}" data-n="${n}">${d}</div>`;
    }
    h+="</div></section>";
  }
  cal.innerHTML=h;
  document.getElementById("dt").value=fmt(start>=Y0&&start<=Y1?start:Y0+(((start-Y0)%C)+C)%C);
  document.getElementById("info").textContent=`W roku: ${wc} dni pracy, ${oc} wolnych`;
}
function setStart(n){start=n;render()}
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>setStart(start+ +b.dataset.s));
document.getElementById("dt").onchange=e=>{if(e.target.value){const[a,b,c]=e.target.value.split("-").map(Number);setStart(num(a,b-1,c))}};
document.getElementById("cal").onclick=e=>{
  const t=e.target.closest(".d");if(!t)return;
  const n=+t.dataset.n;setStart(document.getElementById("mode").value==="w"?n:n-W);
};
render();
</script>
</body>
</html>
